[platformio]
default_envs = esp32c3_bridge

[env:esp32c3_bridge]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BRIDGE_RX_PIN=20
  -D BRIDGE_TX_PIN=21
  -D BRIDGE_UART_BAUD=115200

