[package]
name = "dart-wifi-receiver"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "io-util", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "timeout", "limit", "set-header"] }
