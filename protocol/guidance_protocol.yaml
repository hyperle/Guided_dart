# Shared guidance frame and parameter protocol definition.
# Host-side tools read this schema directly.
# STM32 consumes the generated header emitted from the same schema.

frame:
  header_0: 165
  header_1: 90

message_types:
  guidance_telemetry:
    macro: ESP32_LINK_MESSAGE_TYPE_GUIDANCE_TELEMETRY
    value: 1
  param_command:
    macro: ESP32_LINK_MESSAGE_TYPE_PARAM_COMMAND
    value: 2
  param_ack:
    macro: ESP32_LINK_MESSAGE_TYPE_PARAM_ACK
    value: 3

param_status:
  applied:
    macro: ESP32_LINK_PARAM_STATUS_APPLIED
    value: 0
  unknown_key:
    macro: ESP32_LINK_PARAM_STATUS_UNKNOWN_KEY
    value: 1
  invalid_value:
    macro: ESP32_LINK_PARAM_STATUS_INVALID_VALUE
    value: 2
  invalid_length:
    macro: ESP32_LINK_PARAM_STATUS_INVALID_LENGTH
    value: 3
  relay_failed:
    macro: ESP32_LINK_PARAM_STATUS_RELAY_FAILED
    value: 4
  relay_timeout:
    macro: ESP32_LINK_PARAM_STATUS_RELAY_TIMEOUT
    value: 5

params:
  green_light.setpoint_x:
    macro: ESP32_LINK_PARAM_KEY_SETPOINT_X
    value_type: u32
    key: 1
  green_light.setpoint_y:
    macro: ESP32_LINK_PARAM_KEY_SETPOINT_Y
    value_type: u32
    key: 2
  # Legacy compatibility keys. These are forwarded to OpenMV as aliases.
  green_light.detector_min_green_channel:
    macro: ESP32_LINK_PARAM_KEY_DETECTOR_MIN_GREEN_CHANNEL
    value_type: u32
    key: 16
  green_light.detector_min_green_dominance:
