# Shared guidance uplink frame protocol definition.
# Host-side viewers read this schema directly.
# STM32 consumes the generated header emitted from the same schema.

frame:
  header_0: 165
  header_1: 90

message_types:
  guidance_telemetry:
    macro: ESP32_LINK_MESSAGE_TYPE_GUIDANCE_TELEMETRY
    value: 1
  imu_accel:
    macro: ESP32_LINK_MESSAGE_TYPE_IMU_ACCEL
    value: 4
  imu_motion:
    macro: ESP32_LINK_MESSAGE_TYPE_IMU_MOTION
    value: 5
